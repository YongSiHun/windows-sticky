name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Bundle offline installers
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-note-setup
          path: |
            artifacts/sticky_note_setup_x86.exe
            artifacts/sticky_note_setup_x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
