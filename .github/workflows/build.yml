name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Read version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle offline installers
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stricky-setup-${{ env.APP_VERSION }}
          path: |
            artifacts/windows_stricky_setup_x86.exe
            artifacts/windows_stricky_setup_x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
