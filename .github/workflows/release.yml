name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test both platforms
        run: |
          foreach ($platform in @('x86', 'x64')) {
            msbuild StickyNote.sln /restore /m /p:Configuration=Release /p:Platform=$platform /p:RestoreConfigFile="$pwd\NuGet.Config"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\tests\StickyNote.Tests\bin\$platform\Release\StickyNote.Tests.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package and checksum
        run: ./scripts/package.ps1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" artifacts/sticky_note_windows_x86.zip artifacts/sticky_note_windows_x64.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes
